server {
    listen ${PORT};
    server_name _;
    # Cloud Run listens on 8080 internally; without this, trailing-slash redirects
    # become Location: http://host:8080/… (breaks the browser on HTTPS).
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    include /etc/nginx/conf.d/proxies/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
