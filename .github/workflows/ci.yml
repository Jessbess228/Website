name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn build

  puppy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout puppy_data-collection
        uses: actions/checkout@v4
        with:
          repository: Jessbess228/puppy_data-collection
          path: puppy_data-collection

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Django deps
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework django-cors-headers python-dotenv requests
          pip install -e ./puppy_data-collection

      - name: Test
        working-directory: puppy-api
        env:
          DJANGO_DEBUG: "false"
          ENABLE_FETCH_SCHEDULER: "false"
        run: python manage.py test