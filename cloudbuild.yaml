# Cloud Build: image names must be lowercase (not "Website" from the GitHub repo name).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/website:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/website:latest
      - .

images:
  - gcr.io/$PROJECT_ID/website:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/website:latest